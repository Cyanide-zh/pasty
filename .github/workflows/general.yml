name: general

on:
  pull_request:
  workflow_dispatch: 
  #push:
    #paths-ignore:
 #     - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v2
      - name: setup go environment
        uses: actions/setup-go@v2
        with:
          go-version: ^1.16
      - name: download dependencies
        run: |
          go version
          go mod download
      - name: build
        run: |
          GOOS=linux GOARCH=arm64 go build ./cmd/pasty/    #arm64 only, to build AMD64 use "go build ./cmd/pasty/"
          ls -l
      - name: Upload Pasty
        uses: actions/upload-artifact@v4
        with:
          name: Pasty
          path: ./*
